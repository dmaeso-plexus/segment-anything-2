<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-label="NEXUS42 logo">
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16406E"/>
      <stop offset="0.55" stop-color="#0E2A52"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35E0E6"/>
      <stop offset="1" stop-color="#12B5BC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35E0E6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#35E0E6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Emblem: flat-top hexagon centred at (75,70), centre-to-vertex R=58 -->
  <g transform="translate(75,70)">
    <polygon points="58,0 29,50.23 -29,50.23 -58,0 -29,-50.23 29,-50.23"
             fill="url(#hex)" stroke="url(#edge)" stroke-width="3"/>
    <!-- neural nodes -->
    <g>
      <line x1="0" y1="-24" x2="-21" y2="16" stroke="#35E0E6" stroke-width="2.4" stroke-opacity="0.7"/>
      <line x1="0" y1="-24" x2="21" y2="16" stroke="#35E0E6" stroke-width="2.4" stroke-opacity="0.7"/>
      <line x1="-21" y1="16" x2="21" y2="16" stroke="#35E0E6" stroke-width="2.4" stroke-opacity="0.7"/>
      <circle cx="0" cy="-24" r="13" fill="url(#glow)"/>
      <circle cx="0" cy="-24" r="7.5" fill="#C9A24B"/>
      <circle cx="-21" cy="16" r="11" fill="url(#glow)"/>
      <circle cx="-21" cy="16" r="6.5" fill="#35E0E6"/>
      <circle cx="21" cy="16" r="11" fill="url(#glow)"/>
      <circle cx="21" cy="16" r="6.5" fill="#35E0E6"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="158" y="78" font-size="46" font-weight="700" letter-spacing="1.5" fill="#0B1F3A">NEXUS<tspan fill="#C9A24B">42</tspan></text>
    <text x="160" y="104" font-size="13.5" font-weight="600" letter-spacing="6" fill="#5A6B7B">SOVEREIGN&#160;INTELLIGENCE</text>
  </g>
</svg>
